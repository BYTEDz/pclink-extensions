<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Starter Template</title>

    <!-- PCLink Unified Host Broker SDK -->
    <script src="/extensions/sdk/pclink-sdk.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: transparent;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-muted: rgba(59, 130, 246, 0.2);
            --primary-faint: rgba(59, 130, 246, 0.08);
            --on-primary: #ffffff;
            --text: #f8fafc;
            --text-muted: rgba(248, 250, 252, 0.6);
            --card-border: 1px solid rgba(255, 255, 255, 0.08);
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            --radius: 16px;
        }

        :root[data-theme="light"] {
            --surface: rgba(0, 0, 0, 0.04);
            --surface-hover: rgba(0, 0, 0, 0.07);
            --text: #0f172a;
            --text-muted: #64748b;
            --card-border: 1px solid rgba(0, 0, 0, 0.08);
            --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background: transparent !important;
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            padding: 16px;
            padding-top: calc(16px + var(--safe-area-inset-top, 0px));
            padding-bottom: calc(24px + var(--safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hero {
            padding: 32px 16px;
            text-align: center;
            background: var(--surface);
            border-radius: var(--radius);
            border: var(--card-border);
            box-shadow: var(--card-shadow);
        }

        .hero h1 {
            margin: 0;
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: 800;
        }

        .status-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 12px;
            background: var(--primary-faint);
            border: 1px solid var(--primary-muted);
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary);
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            border: var(--card-border);
            box-shadow: var(--card-shadow);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-action {
            background: var(--primary);
            color: var(--on-primary);
            border: none;
            padding: 12px 20px;
            border-radius: calc(var(--radius) * 0.75);
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s ease;
        }

        .btn-action:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background: var(--surface-hover);
            color: var(--text);
            border: var(--card-border);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>Starter Kit</h1>
            <div id="status-label" class="status-badge">Awaiting Query</div>
        </div>

        <div class="card">
            <h3 style="margin: 0; font-size: 1rem; font-weight: 700;">Backend Health Probe</h3>
            <p style="margin: 0; font-size: 0.85rem; color: var(--text-muted);">
                Communicates with isolated worker backend using PCLink Extension SDK.
            </p>

            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
                <button class="btn-action" onclick="pingServer()">
                    <i data-lucide="activity" style="width: 16px; height: 16px;"></i>
                    Query Extension Endpoint
                </button>
                <button class="btn-action btn-secondary" onclick="window.location.reload()">
                    <i data-lucide="refresh-cw" style="width: 16px; height: 16px;"></i>
                    Reload UI
                </button>
            </div>
        </div>
    </div>

    <script>
        async function pingServer() {
            if (window.pclink && window.pclink.ui) pclink.ui.haptic('selection');
            const label = document.getElementById('status-label');
            label.innerText = 'Connecting...';

            try {
                const response = await fetch('./status', { credentials: 'include' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                label.innerText = `Status: ${data.status} | Version: ${data.version}`;
                label.style.color = 'var(--primary)';
            } catch (error) {
                console.error('Backend unreachable:', error);
                label.innerText = 'Connection Failed';
                label.style.color = 'var(--danger, #ef4444)';
            }
        }

        lucide.createIcons();
    </script>
</body>
</html>
