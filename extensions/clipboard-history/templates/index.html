<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clipboard History</title>

    <!-- PCLink Unified Host Broker SDK -->
    <script src="/extensions/sdk/pclink-sdk.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: transparent;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-muted: rgba(59, 130, 246, 0.18);
            --on-primary: #ffffff;
            --text: #f8fafc;
            --text-muted: rgba(248, 250, 252, 0.6);
            --danger: #ef4444;
            --danger-muted: rgba(239, 68, 68, 0.15);
            --card-border: 1px solid rgba(255, 255, 255, 0.08);
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            --radius: 16px;
        }

        :root[data-theme="light"] {
            --surface: rgba(0, 0, 0, 0.04);
            --surface-hover: rgba(0, 0, 0, 0.07);
            --text: #0f172a;
            --text-muted: #64748b;
            --card-border: 1px solid rgba(0, 0, 0, 0.08);
            --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background: transparent !important;
            background-color: transparent !important;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            padding: 16px;
            padding-top: calc(16px + var(--safe-area-inset-top, 0px));
            padding-bottom: calc(24px + var(--safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .header-bar h1 {
            font-size: 1.25rem;
            margin: 0;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }

        .send-container {
            background: var(--surface);
            border: var(--card-border);
            border-radius: var(--radius);
            padding: 6px 6px 6px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--card-shadow);
            transition: border-color 0.2s;
        }

        .send-container:focus-within {
            border-color: var(--primary);
        }

        .send-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
        }

        .btn-send {
            background: var(--primary);
            color: var(--on-primary);
            border: none;
            padding: 10px 16px;
            border-radius: calc(var(--radius) * 0.75);
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.1s ease;
        }

        .btn-send:active {
            transform: scale(0.95);
        }

        .filter-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            background: var(--surface);
            border: var(--card-border);
            border-radius: calc(var(--radius) * 0.7);
            padding: 10px 14px;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .btn-clear {
            background: var(--surface);
            border: var(--card-border);
            color: var(--danger);
            border-radius: calc(var(--radius) * 0.7);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s ease;
        }

        .btn-clear:active {
            background: var(--danger-muted);
        }

        .clip-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .clip-card {
            background: var(--surface);
            border: var(--card-border);
            border-radius: var(--radius);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            box-shadow: var(--card-shadow);
            cursor: pointer;
            transition: transform 0.1s ease, background 0.15s ease;
        }

        .clip-card:active {
            transform: scale(0.99);
        }

        .clip-info {
            flex: 1;
            min-width: 0;
        }

        .clip-text {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
            font-family: 'JetBrains Mono', 'SF Mono', monospace;
        }

        .clip-time {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .clip-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--surface-hover);
            border: var(--card-border);
            color: var(--text);
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-icon:active {
            transform: scale(0.92);
        }

        /* Detail Modal Overlay */
        #detailModal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-sheet {
            background: var(--surface);
            border: var(--card-border);
            border-radius: var(--radius);
            width: 100%;
            max-width: 440px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--card-border);
        }

        .modal-content {
            padding: 16px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
        }

        .modal-footer {
            padding: 12px 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            border-top: var(--card-border);
        }

        .empty-state {
            text-align: center;
            padding: 48px 16px;
            color: var(--text-muted);
            border-radius: var(--radius);
            border: 1px dashed var(--card-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1>
                <i data-lucide="clipboard" style="width: 20px; height: 20px; color: var(--primary);"></i>
                Clipboard History
            </h1>
            <span id="clipCount" style="font-size: 10px; font-weight: 800; opacity: 0.5; text-transform: uppercase;">0 Clips</span>
        </div>

        <!-- Push Text to PC Bar -->
        <div class="send-container">
            <input type="text" id="sendInput" class="send-input" placeholder="Push text to PC clipboard..." onkeydown="if(event.key==='Enter') sendToPc()">
            <button class="btn-send" onclick="sendToPc()">
                <i data-lucide="send" style="width: 14px; height: 14px;"></i> Send
            </button>
        </div>

        <!-- Search & Clear Row -->
        <div class="filter-row">
            <input type="text" id="searchInput" class="search-input" placeholder="Search history..." oninput="handleSearch()">
            <button class="btn-clear" onclick="clearAllHistory()" title="Clear history">
                <i data-lucide="trash-2" style="width: 18px; height: 18px;"></i>
            </button>
        </div>

        <!-- History Items -->
        <div id="clipList" class="clip-list">
            <div class="empty-state">
                <i data-lucide="clock" style="width: 36px; height: 36px; opacity: 0.4;"></i>
                <span>Loading clipboard history...</span>
            </div>
        </div>
    </div>

    <!-- Detail View Modal -->
    <div id="detailModal">
        <div class="modal-sheet">
            <div class="modal-header">
                <span style="font-weight: 800; font-size: 0.85rem; text-transform: uppercase;">Clip Details</span>
                <button onclick="closeDetail()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;"><i data-lucide="x" style="width: 18px; height: 18px;"></i></button>
            </div>
            <div id="modalBody" class="modal-content"></div>
            <div class="modal-footer">
                <button class="btn-send" style="background:var(--surface-hover); color:var(--text);" onclick="copyModalContent()">
                    <i data-lucide="copy" style="width: 14px; height: 14px;"></i> Copy to Phone
                </button>
                <button class="btn-send" onclick="sendModalToPc()">
                    <i data-lucide="monitor-up" style="width: 14px; height: 14px;"></i> Push to PC
                </button>
            </div>
        </div>
    </div>

    <script>
        let fullHistory = [];
        let activeItem = null;

        async function fetchHistory() {
            try {
                const res = await fetch('./history', { credentials: 'include' });
                if (!res.ok) return;
                fullHistory = await res.json();
                renderList();
            } catch (e) {
                console.debug("History sync skipped:", e);
            }
        }

        function renderList() {
            const listEl = document.getElementById('clipList');
            const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();

            const filtered = fullHistory.filter(i => (i.content || '').toLowerCase().includes(search));
            document.getElementById('clipCount').innerText = `${filtered.length} Clips`;

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <i data-lucide="clipboard-x" style="width: 36px; height: 36px; opacity: 0.4;"></i>
                        <span>No clipboard items found</span>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            listEl.innerHTML = filtered.map(item => `
                <div class="clip-card" onclick="openDetail(${item.id})">
                    <div class="clip-info">
                        <div class="clip-text" title="${escapeHtml(item.content)}">${escapeHtml(item.content)}</div>
                        <div class="clip-time">${new Date(item.timestamp * 1000).toLocaleTimeString()}</div>
                    </div>
                    <div class="clip-actions" onclick="event.stopPropagation()">
                        <button class="btn-icon" onclick="copyToPhone('${escapeAttr(item.content)}')" title="Copy to Phone">
                            <i data-lucide="copy" style="width: 15px; height: 15px;"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        async function sendToPc() {
            const input = document.getElementById('sendInput');
            const text = (input.value || '').trim();
            if (!text) return;

            if (window.pclink && window.pclink.ui) pclink.ui.haptic('selection');

            try {
                await fetch('./copy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: text }),
                    credentials: 'include'
                });
                input.value = '';
                await fetchHistory();
            } catch (e) {
                console.error("Failed to push to PC:", e);
            }
        }

        function copyToPhone(text) {
            if (window.pclink && window.pclink.ui) pclink.ui.haptic('selection');
            navigator.clipboard.writeText(text);
        }

        function openDetail(id) {
            activeItem = fullHistory.find(i => i.id === id);
            if (!activeItem) return;

            document.getElementById('modalBody').textContent = activeItem.content;
            document.getElementById('detailModal').style.display = 'flex';
            lucide.createIcons();
        }

        function closeDetail() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function copyModalContent() {
            if (activeItem) {
                copyToPhone(activeItem.content);
                closeDetail();
            }
        }

        async function sendModalToPc() {
            if (activeItem) {
                document.getElementById('sendInput').value = activeItem.content;
                await sendToPc();
                closeDetail();
            }
        }

        async function clearAllHistory() {
            if (!confirm("Clear all captured clipboard history?")) return;
            if (window.pclink && window.pclink.ui) pclink.ui.haptic('error');
            try {
                await fetch('./clear', { method: 'POST', credentials: 'include' });
                await fetchHistory();
            } catch (e) {}
        }

        function handleSearch() {
            renderList();
        }

        function escapeHtml(str) {
            const p = document.createElement('p');
            p.textContent = str;
            return p.innerHTML;
        }

        function escapeAttr(str) {
            return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        lucide.createIcons();
        fetchHistory();
        setInterval(fetchHistory, 2500);
    </script>
</body>
</html>
