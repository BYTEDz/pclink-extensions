<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Audio Mixer</title>

    <!-- PCLink Unified Host Broker SDK -->
    <script src="/extensions/sdk/pclink-sdk.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: transparent;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-muted: rgba(59, 130, 246, 0.2);
            --primary-faint: rgba(59, 130, 246, 0.08);
            --on-primary: #ffffff;
            --text: #f8fafc;
            --text-muted: rgba(248, 250, 252, 0.6);
            --danger: #ef4444;
            --card-border: 1px solid rgba(255, 255, 255, 0.08);
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            --radius: 16px;
        }

        :root[data-theme="light"] {
            --surface: rgba(0, 0, 0, 0.04);
            --surface-hover: rgba(0, 0, 0, 0.07);
            --text: #0f172a;
            --text-muted: #64748b;
            --card-border: 1px solid rgba(0, 0, 0, 0.08);
            --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background: transparent !important;
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            padding: 16px;
            padding-top: calc(16px + var(--safe-area-inset-top, 0px));
            padding-bottom: calc(24px + var(--safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            gap: 12px;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .header h1 {
            font-size: 1.25rem;
            margin: 0;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }

        .channel {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: var(--card-border);
            box-shadow: var(--card-shadow);
            transition: transform 0.15s ease;
        }

        .channel:active {
            transform: scale(0.99);
        }

        .icon-container {
            width: 44px;
            height: 44px;
            background: var(--primary-faint);
            border-radius: calc(var(--radius) * 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            flex-shrink: 0;
            border: 1px solid var(--primary-muted);
        }

        .controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        .info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .app-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 8px;
        }

        .vol-text {
            color: var(--primary);
            font-family: 'JetBrains Mono', 'SF Mono', monospace;
            font-size: 0.95rem;
            font-weight: 800;
            flex-shrink: 0;
        }

        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            height: 24px;
            cursor: pointer;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            background: var(--surface-hover);
            border-radius: 100px;
            border: var(--card-border);
        }

        input[type=range]::-webkit-slider-thumb {
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            border: 2px solid #ffffff;
            transition: transform 0.1s ease;
        }

        input[type=range]:active::-webkit-slider-thumb {
            transform: scale(1.2);
        }

        .mute-btn {
            background: var(--surface-hover);
            border: var(--card-border);
            color: var(--text-muted);
            cursor: pointer;
            width: 42px;
            height: 42px;
            border-radius: calc(var(--radius) * 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .mute-btn.active {
            background: var(--danger);
            color: #ffffff;
            border-color: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 48px 16px;
            color: var(--text-muted);
            border-radius: var(--radius);
            border: 1px dashed var(--card-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .empty-state svg {
            width: 40px;
            height: 40px;
            opacity: 0.4;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <i data-lucide="sliders" style="width: 20px; height: 20px; color: var(--primary);"></i>
                Audio Mixer
            </h1>
            <span style="font-size: 10px; font-weight: 800; opacity: 0.5; text-transform: uppercase;">Real-Time</span>
        </div>

        <div id="list">
            <div class="empty-state">
                <i data-lucide="volume-x"></i>
                <span style="font-weight: 700; font-size: 0.9rem;">Scanning audio streams...</span>
                <span style="font-size: 0.75rem;">Detecting active applications playing sound.</span>
            </div>
        </div>
    </div>

    <script>
        let cachedSessions = [];
        let debounceTimers = {};

        async function refresh() {
            if (document.activeElement && document.activeElement.type === 'range') return;

            try {
                const res = await fetch('./sessions', { credentials: 'include' });
                if (!res.ok) return;
                const sessions = await res.json();
                cachedSessions = sessions;
                render(sessions);
            } catch (e) {
                console.debug("Audio session refresh skipped:", e);
            }
        }

        function render(sessions) {
            const list = document.getElementById('list');

            if (!sessions || sessions.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i data-lucide="volume-x"></i>
                        <span style="font-weight: 700; font-size: 0.9rem;">No active audio sessions</span>
                        <span style="font-size: 0.75rem;">Open a media player or browser tab to mix audio.</span>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            list.innerHTML = sessions.map(s => `
                <div class="channel" data-id="${s.id}">
                    <div class="icon-container">
                        <i data-lucide="${s.icon || 'volume-2'}" style="width: 20px; height: 20px;"></i>
                    </div>
                    <div class="controls">
                        <div class="info">
                            <span class="app-name">${s.name}</span>
                            <span class="vol-text" id="vol-${s.id}">${Math.round(s.volume * 100)}%</span>
                        </div>
                        <input type="range" min="0" max="1" step="0.01" value="${s.volume}"
                            oninput="handleVolumeInput('${s.id}', this.value)">
                    </div>
                    <button class="mute-btn ${s.muted ? 'active' : ''}" onclick="toggleMute('${s.id}', ${!s.muted})" aria-label="Toggle Mute">
                        <i data-lucide="${s.muted ? 'volume-x' : 'volume-2'}" style="width: 18px; height: 18px;"></i>
                    </button>
                </div>
            `).join('');

            lucide.createIcons();
        }

        function handleVolumeInput(id, vol) {
            const textEl = document.getElementById(`vol-${id}`);
            if (textEl) {
                textEl.innerText = `${Math.round(vol * 100)}%`;
            }

            clearTimeout(debounceTimers[id]);
            debounceTimers[id] = setTimeout(() => {
                sendVolume(id, vol);
            }, 60);
        }

        async function sendVolume(id, vol) {
            if (window.pclink && window.pclink.ui) pclink.ui.haptic('selection');
            try {
                await fetch('./volume', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, volume: parseFloat(vol) }),
                    credentials: 'include'
                });
            } catch (e) {
                console.error("Failed to set volume:", e);
            }
        }

        async function toggleMute(id, state) {
            if (window.pclink && window.pclink.ui) pclink.ui.haptic(state ? 'error' : 'selection');
            try {
                await fetch('./mute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, muted: state }),
                    credentials: 'include'
                });
                refresh();
            } catch (e) {
                console.error("Failed to toggle mute:", e);
            }
        }

        lucide.createIcons();
        refresh();
        setInterval(refresh, 3000);
    </script>
</body>
</html>
