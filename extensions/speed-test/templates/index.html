<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Speed Engine</title>

    <!-- PCLink Unified Host Broker SDK -->
    <script src="/extensions/sdk/pclink-sdk.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: transparent;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-muted: rgba(59, 130, 246, 0.2);
            --primary-faint: rgba(59, 130, 246, 0.08);
            --on-primary: #ffffff;
            --text: #f8fafc;
            --text-muted: rgba(248, 250, 252, 0.6);
            --success: #10b981;
            --card-border: 1px solid rgba(255, 255, 255, 0.08);
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            --radius: 16px;
        }

        :root[data-theme="light"] {
            --surface: rgba(0, 0, 0, 0.04);
            --surface-hover: rgba(0, 0, 0, 0.07);
            --text: #0f172a;
            --text-muted: #64748b;
            --card-border: 1px solid rgba(0, 0, 0, 0.08);
            --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background: transparent !important;
            background-color: transparent !important;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            padding: 16px;
            padding-top: calc(16px + var(--safe-area-inset-top, 0px));
            padding-bottom: calc(24px + var(--safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            user-select: none;
        }

        .header {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.3px;
        }

        .status-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--surface);
            color: var(--text-muted);
            border: var(--card-border);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tabs {
            display: flex;
            background: var(--surface);
            padding: 4px;
            border-radius: var(--radius);
            width: 100%;
            max-width: 440px;
            border: var(--card-border);
            gap: 4px;
        }

        .tab {
            flex: 1;
            padding: 8px 12px;
            text-align: center;
            font-size: 12px;
            font-weight: 800;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: calc(var(--radius) * 0.75);
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab.active {
            background: var(--primary);
            color: var(--on-primary);
            box-shadow: 0 4px 12px var(--primary-muted);
        }

        /* SVG GAUGE */
        .gauge-container {
            position: relative;
            width: 220px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gauge-svg {
            transform: rotate(-220deg);
            width: 220px;
            height: 220px;
            position: absolute;
            top: -20px;
        }

        .gauge-track {
            fill: none;
            stroke: var(--surface);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 440;
            stroke-dashoffset: 176;
        }

        .gauge-fill {
            fill: none;
            stroke: var(--primary);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 440;
            stroke-dashoffset: 440;
            transition: stroke-dashoffset 0.6s cubic-bezier(0.2, 0, 0, 1);
            filter: drop-shadow(0 0 10px var(--primary-muted));
        }

        .gauge-content {
            z-index: 10;
            text-align: center;
            margin-top: 40px;
        }

        .speed-number {
            font-size: 50px;
            font-weight: 900;
            margin: 0;
            line-height: 1;
            font-family: 'JetBrains Mono', 'SF Mono', monospace;
            letter-spacing: -2px;
        }

        .speed-unit {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .main-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 440px;
        }

        .stat-card {
            background: var(--surface);
            padding: 14px;
            border-radius: var(--radius);
            border: var(--card-border);
            text-align: center;
            box-shadow: var(--card-shadow);
        }

        .stat-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 800;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 900;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text);
        }

        .stat-unit {
            font-size: 10px;
            color: var(--text-muted);
            margin-left: 2px;
            font-family: sans-serif;
            font-weight: 700;
        }

        .btn-start {
            width: 100%;
            max-width: 440px;
            padding: 16px;
            background: var(--primary);
            color: var(--on-primary);
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 20px var(--primary-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1), opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-start:active:not(:disabled) {
            transform: scale(0.96);
        }

        .btn-start:disabled {
            background: var(--surface);
            color: var(--text-muted);
            box-shadow: none;
            opacity: 0.5;
            cursor: default;
        }

        .history-section {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-card {
            background: var(--surface);
            border-radius: calc(var(--radius) * 0.75);
            border: var(--card-border);
            padding: 12px 14px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 12px;
        }

        .history-icon {
            width: 32px;
            height: 32px;
            background: var(--primary-faint);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand-title">
            <i data-lucide="gauge" style="width: 20px; height: 20px; color: var(--primary);"></i>
            Speed Engine
        </div>
        <div id="statusBadge" class="status-badge">Ready</div>
    </div>

    <div class="tabs">
        <div class="tab active" id="tabInternet" onclick="setMode('internet')">Broadband</div>
        <div class="tab" id="tabLan" onclick="setMode('lan')">Local Link</div>
    </div>

    <div class="gauge-container">
        <svg class="gauge-svg" viewBox="0 0 200 200">
            <circle class="gauge-track" cx="100" cy="100" r="70" />
            <circle class="gauge-fill" id="gaugeFill" cx="100" cy="100" r="70" />
        </svg>
        <div class="gauge-content">
            <div class="speed-number" id="mainSpeed">0.0</div>
            <div class="speed-unit" id="mainUnit">Mbps</div>
        </div>
    </div>

    <div class="main-stats">
        <div class="stat-card">
            <div class="stat-label">Download</div>
            <div class="stat-value" id="dlDisplay">0.0 <span class="stat-unit">Mbps</span></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Upload</div>
            <div class="stat-value" id="ulDisplay">0.0 <span class="stat-unit">Mbps</span></div>
        </div>
    </div>

    <button id="startBtn" class="btn-start" onclick="startTest()">
        <i data-lucide="play" style="width: 18px; height: 18px;"></i>
        <span>Start Speed Test</span>
    </button>

    <div class="history-section">
        <span style="font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px;">Recent Runs</span>
        <div id="historyList" style="display: flex; flex-direction: column; gap: 6px;"></div>
    </div>

    <script>
        let isTesting = false;
        let currentMode = 'internet';
        let testHistory = JSON.parse(localStorage.getItem('pclink_speed_history') || '[]');

        function formatSpeed(mbps) {
            if (mbps >= 1000) return { value: (mbps / 1000).toFixed(2), unit: "Gbps" };
            return { value: Number(mbps).toFixed(1), unit: "Mbps" };
        }

        function setMode(mode) {
            if (isTesting) return;
            currentMode = mode;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(mode === 'internet' ? 'tabInternet' : 'tabLan').classList.add('active');
            updateStatus('Ready');
        }

        function updateGauge(speed) {
            const maxRef = 500;
            const circlePerimeter = 2 * Math.PI * 70;
            const visibleArc = 0.61;
            const minOffset = circlePerimeter * (1 - visibleArc);

            const percent = Math.min(speed / maxRef, 1);
            const offset = circlePerimeter - (percent * (circlePerimeter - minOffset));
            document.getElementById('gaugeFill').style.strokeDashoffset = offset;
        }

        /**
         * Accurate Multi-Sample Ping Probe from Phone to PC
         */
        async function measureAccuratePing() {
            const samples = [];
            // Run 5 warm micro-probes and drop the cold setup connection
            for (let i = 0; i < 5; i++) {
                const t0 = performance.now();
                try {
                    await fetch('./ping', { credentials: 'include', cache: 'no-store' });
                    const dt = performance.now() - t0;
                    if (i > 0) samples.push(dt); // Ignore cold sample 0
                } catch (e) {}
            }
            if (samples.length === 0) return 1.0;
            samples.sort((a, b) => a - b);
            return Math.round(samples[Math.floor(samples.length / 2)]); // Median latency
        }

        async function startTest() {
            if (isTesting) return;

            if (window.pclink && window.pclink.ui) pclink.ui.haptic('selection');
            isTesting = true;
            document.getElementById('startBtn').disabled = true;

            if (currentMode === 'internet') {
                try {
                    const res = await fetch('./start', { method: 'POST', credentials: 'include' });
                    if (res.ok) {
                        pollBroadbandUI();
                    } else {
                        isTesting = false;
                        document.getElementById('startBtn').disabled = false;
                    }
                } catch (e) {
                    isTesting = false;
                    document.getElementById('startBtn').disabled = false;
                }
            } else {
                startLanTest();
            }
        }

        async function startLanTest() {
            let maxMeasured = 0;
            try {
                updateStatus('Measuring Latency...');
                const phoneToPcPing = await measureAccuratePing();

                updateStatus('Testing Download...');
                const dlRes = await fetch('./local/download', { credentials: 'include' });
                const reader = dlRes.body.getReader();
                let received = 0;
                const startDl = performance.now();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    received += value.length;
                    const elapsed = (performance.now() - startDl) / 1000;
                    const mbps = (received * 8) / (1024 * 1024) / Math.max(0.01, elapsed);
                    refreshDisplay(mbps, 0);
                    if (mbps > maxMeasured) maxMeasured = mbps;
                }

                updateStatus('Testing Upload...');
                const uploadData = new Uint8Array(12 * 1024 * 1024); // 12 MB buffer
                const startUl = performance.now();

                await fetch('./local/upload', {
                    method: 'POST',
                    body: uploadData,
                    credentials: 'include'
                });

                const elapsedUl = (performance.now() - startUl) / 1000;
                const uploadMbps = (uploadData.length * 8) / (1024 * 1024) / Math.max(0.01, elapsedUl);

                const finalDl = maxMeasured;
                const finalUl = uploadMbps;

                refreshDisplay(finalDl, finalUl);
                updateStatus('Complete');

                if (window.pclink && window.pclink.ui) pclink.ui.haptic('success');

                const entry = {
                    mode: 'LAN Wi-Fi',
                    download: finalDl,
                    upload: finalUl,
                    ping: phoneToPcPing,
                    timestamp: Date.now() / 1000
                };
                updateHistory(entry);

                await fetch('./local/results', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ download: finalDl, upload: finalUl, ping: phoneToPcPing }),
                    credentials: 'include'
                });

            } catch (e) {
                updateStatus('Link Error');
            } finally {
                isTesting = false;
                document.getElementById('startBtn').disabled = false;
            }
        }

        function refreshDisplay(dlMbps, ulMbps) {
            const activeSpeed = dlMbps > 0 ? dlMbps : ulMbps;
            const fActive = formatSpeed(activeSpeed);
            const fDl = formatSpeed(dlMbps);
            const fUl = formatSpeed(ulMbps);

            document.getElementById('mainSpeed').textContent = fActive.value;
            document.getElementById('mainUnit').textContent = fActive.unit;
            updateGauge(activeSpeed);

            document.getElementById('dlDisplay').innerHTML = `${fDl.value} <span class="stat-unit">${fDl.unit}</span>`;
            document.getElementById('ulDisplay').innerHTML = `${fUl.value} <span class="stat-unit">${fUl.unit}</span>`;
        }

        async function pollBroadbandUI() {
            try {
                const res = await fetch('./status', { credentials: 'include' });
                if (!res.ok) return;
                const data = await res.json();

                if (data.status === 'testing') {
                    refreshDisplay(data.download, data.upload);
                    updateStatus(data.phase || 'Testing...');
                    setTimeout(pollBroadbandUI, 800);
                } else if (data.status === 'complete') {
                    refreshDisplay(data.download, data.upload);
                    updateStatus('Complete');
                    isTesting = false;
                    document.getElementById('startBtn').disabled = false;

                    if (window.pclink && window.pclink.ui) pclink.ui.haptic('success');

                    updateHistory({
                        mode: 'Broadband',
                        download: data.download,
                        upload: data.upload,
                        ping: data.ping,
                        timestamp: data.timestamp
                    });
                } else if (data.status === 'error') {
                    updateStatus(data.error_message || 'Test Error');
                    isTesting = false;
                    document.getElementById('startBtn').disabled = false;
                }
            } catch (e) {
                isTesting = false;
                document.getElementById('startBtn').disabled = false;
            }
        }

        function updateHistory(entry) {
            testHistory.unshift(entry);
            if (testHistory.length > 5) testHistory.pop();
            localStorage.setItem('pclink_speed_history', JSON.stringify(testHistory));
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            if (testHistory.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:11px; padding:12px;">No recent speed tests</div>';
                return;
            }
            container.innerHTML = testHistory.map(h => {
                const dl = formatSpeed(h.download);
                const ul = formatSpeed(h.upload);
                const date = new Date(h.timestamp * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                return `
                    <div class="history-card">
                        <div class="history-icon"><i data-lucide="${h.mode.includes('LAN') ? 'wifi' : 'globe'}" style="width:16px; height:16px;"></i></div>
                        <div>
                            <div style="font-size:12px; font-weight:800;">${h.mode}</div>
                            <div style="font-size:10px; color:var(--text-muted); font-weight:600;">${date} • ${h.ping} ms</div>
                        </div>
                        <div style="text-align:right; font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:900;">
                            <div>${dl.value} <span style="font-size:9px; color:var(--text-muted); font-family:sans-serif;">${dl.unit} ↓</span></div>
                            <div style="font-size:10px; opacity:0.7;">${ul.value} <span style="font-size:8px; color:var(--text-muted); font-family:sans-serif;">${ul.unit} ↑</span></div>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function updateStatus(text) {
            document.getElementById('statusBadge').textContent = text;
        }

        lucide.createIcons();
        renderHistory();
    </script>
</body>
</html>
