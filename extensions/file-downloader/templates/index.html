<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>File Downloader Pro</title>

    <!-- PCLink Unified Host Broker SDK -->
    <script src="/extensions/sdk/pclink-sdk.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: transparent;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-muted: rgba(59, 130, 246, 0.2);
            --primary-faint: rgba(59, 130, 246, 0.08);
            --on-primary: #ffffff;
            --text: #f8fafc;
            --text-muted: rgba(248, 250, 252, 0.6);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --card-border: 1px solid rgba(255, 255, 255, 0.08);
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            --radius: 16px;
        }

        :root[data-theme="light"] {
            --surface: rgba(0, 0, 0, 0.04);
            --surface-hover: rgba(0, 0, 0, 0.07);
            --text: #0f172a;
            --text-muted: #64748b;
            --card-border: 1px solid rgba(0, 0, 0, 0.08);
            --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background: transparent !important;
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            padding: 16px;
            padding-top: calc(16px + var(--safe-area-inset-top, 0px));
            padding-bottom: calc(24px + var(--safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            gap: 12px;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .header h1 {
            font-size: 1.25rem;
            margin: 0;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }

        .speed-badge {
            font-family: 'JetBrains Mono', 'SF Mono', monospace;
            font-size: 11px;
            font-weight: 800;
            color: var(--primary);
            background: var(--primary-faint);
            border: 1px solid var(--primary-muted);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .location-bar {
            background: var(--surface);
            border: var(--card-border);
            border-radius: var(--radius);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--card-shadow);
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .location-bar:active {
            transform: scale(0.99);
            background: var(--surface-hover);
        }

        .location-text {
            min-width: 0;
            flex: 1;
        }

        .controls-card {
            background: var(--surface);
            border: var(--card-border);
            border-radius: var(--radius);
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            box-shadow: var(--card-shadow);
        }

        .input-bar {
            background: var(--surface);
            border: var(--card-border);
            border-radius: var(--radius);
            padding: 6px 6px 6px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--card-shadow);
        }

        .input-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 600;
            outline: none;
        }

        .btn-action {
            background: var(--surface-hover);
            border: var(--card-border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: calc(var(--radius) * 0.7);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.1s ease;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: var(--primary);
            color: var(--on-primary);
            border: none;
        }

        .task-card {
            background: var(--surface);
            border: var(--card-border);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: var(--card-shadow);
            transition: transform 0.1s ease;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .task-name {
            font-size: 0.9rem;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-url {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .status-chip {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 8px;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .status-downloading { background: var(--primary-faint); color: var(--primary); border: 1px solid var(--primary-muted); }
        .status-paused { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-completed { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-error { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 100px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 100px;
            transition: width 0.2s ease;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: var(--card-border);
            padding-top: 8px;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 48px 16px;
            color: var(--text-muted);
            border-radius: var(--radius);
            border: 1px dashed var(--card-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <i data-lucide="download-cloud" style="width: 20px; height: 20px; color: var(--primary);"></i>
                Downloader Pro
            </h1>
            <div id="totalSpeed" class="speed-badge">0.0 KB/s</div>
        </div>

        <!-- Destination Path Indicator Bar -->
        <div class="location-bar" onclick="changeDownloadDir()" title="Tap to modify host destination folder">
            <i data-lucide="folder" style="width: 16px; height: 16px; color: var(--primary); flex-shrink: 0;"></i>
            <div class="location-text">
                <span style="opacity: 0.5; font-size: 0.65rem; text-transform: uppercase; font-weight: 800; display: block; letter-spacing: 0.5px;">Destination Folder</span>
                <span id="destPathText" style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;">Detecting standard path...</span>
            </div>
            <i data-lucide="edit-3" style="width: 13px; height: 13px; opacity: 0.4; margin-left: auto; flex-shrink: 0;"></i>
        </div>

        <!-- Add Download Input Bar -->
        <div class="input-bar">
            <input type="url" id="urlInput" placeholder="Paste direct download URL..." onkeydown="if(event.key==='Enter') submitDownload()">
            <button class="btn-action btn-primary" onclick="submitDownload()">
                <i data-lucide="plus" style="width: 14px; height: 14px;"></i> Download
            </button>
        </div>

        <!-- Global Control Strip -->
        <div class="controls-card">
            <div style="display: flex; gap: 6px;">
                <button class="btn-action" onclick="pauseAll()">
                    <i data-lucide="pause" style="width: 13px; height: 13px;"></i> Pause All
                </button>
                <button class="btn-action" onclick="resumeAll()">
                    <i data-lucide="play" style="width: 13px; height: 13px;"></i> Resume
                </button>
            </div>
            <button class="btn-action" onclick="clearCompleted()">
                <i data-lucide="trash-2" style="width: 13px; height: 13px;"></i> Clear Done
            </button>
        </div>

        <!-- Task List -->
        <div id="taskList" style="display: flex; flex-direction: column; gap: 10px;">
            <div class="empty-state">
                <i data-lucide="inbox" style="width: 36px; height: 36px; opacity: 0.4;"></i>
                <span style="font-weight: 700; font-size: 0.9rem;">No active downloads</span>
                <span style="font-size: 0.75rem;">Enter a URL above to start downloading directly to your PC.</span>
            </div>
        </div>
    </div>

    <script>
        let cachedTasks = {};
        let isFetching = false;
        let isViewVisible = true;
        let currentDownloadDir = "";

        document.addEventListener('visibilitychange', () => {
            isViewVisible = !document.hidden;
            if (isViewVisible) {
                fetchTasks();
                fetchConfig();
            }
        });

        function formatBytes(bytes) {
            if (!bytes || bytes <= 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatSpeed(bytesSec) {
            if (!bytesSec || bytesSec <= 0) return '0.0 KB/s';
            if (bytesSec > 1024 * 1024) return (bytesSec / (1024 * 1024)).toFixed(2) + ' MB/s';
            return (bytesSec / 1024).toFixed(1) + ' KB/s';
        }

        async function fetchConfig() {
            try {
                const res = await fetch('./downloads/config', { credentials: 'include' });
                if (!res.ok) return;
                const data = await res.json();
                currentDownloadDir = data.download_dir || "";
                const el = document.getElementById('destPathText');
                if (el) {
                    el.textContent = currentDownloadDir;
                    el.title = currentDownloadDir;
                }
            } catch (e) {
                console.debug("Config fetch skipped:", e);
            }
        }

        async function changeDownloadDir() {
            if (window.pclink && window.pclink.ui) pclink.ui.haptic('selection');
            const newPath = prompt("Enter PC destination folder path:", currentDownloadDir);
            if (!newPath || newPath.trim() === "" || newPath.trim() === currentDownloadDir) return;

            try {
                const res = await fetch('./downloads/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ download_dir: newPath.trim() }),
                    credentials: 'include'
                });
                if (res.ok) {
                    const data = await res.json();
                    currentDownloadDir = data.download_dir;
                    document.getElementById('destPathText').textContent = currentDownloadDir;
                    if (window.pclink && window.pclink.ui) pclink.ui.haptic('success');
                } else {
                    const err = await res.json().catch(() => ({ detail: 'Invalid directory path' }));
                    alert(err.detail || 'Failed to update destination directory.');
                }
            } catch (e) {
                alert('Connection error updating directory.');
            }
        }

        async function fetchTasks() {
            if (!isViewVisible || isFetching) return;
            isFetching = true;
            try {
                const res = await fetch('./downloads', { credentials: 'include' });
                if (!res.ok) return;
                cachedTasks = await res.json();
                renderTasks();
            } catch (e) {
                console.debug("Fetch error:", e);
            } finally {
                isFetching = false;
            }
        }

        function renderTasks() {
            const listEl = document.getElementById('taskList');
            const tasks = Object.values(cachedTasks);

            let totalSpeed = 0;
            tasks.forEach(t => {
                if (t.status === 'downloading') totalSpeed += t.speed;
            });
            document.getElementById('totalSpeed').innerText = formatSpeed(totalSpeed);

            if (tasks.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <i data-lucide="inbox" style="width: 36px; height: 36px; opacity: 0.4;"></i>
                        <span style="font-weight: 700; font-size: 0.9rem;">No active downloads</span>
                        <span style="font-size: 0.75rem;">Enter a URL above to start downloading directly to your PC.</span>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            listEl.innerHTML = tasks.map(t => {
                let fillBg = 'var(--primary)';
                if (t.status === 'completed') fillBg = 'var(--success)';
                else if (t.status === 'paused') fillBg = 'var(--warning)';
                else if (t.status === 'error') fillBg = 'var(--danger)';

                return `
                <div class="task-card">
                    <div class="task-header">
                        <div style="min-width: 0; flex: 1;">
                            <div class="task-name" title="${t.filename}">${t.filename}</div>
                            <div class="task-url" title="${t.url}">${t.url}</div>
                        </div>
                        <span class="status-chip status-${t.status}">${t.status}</span>
                    </div>

                    <div class="progress-track">
                        <div class="progress-fill" style="width: ${t.progress}%; background: ${fillBg};"></div>
                    </div>

                    <div class="task-meta">
                        <span>${t.progress}% • ${formatBytes(t.bytes_downloaded)} / ${formatBytes(t.total_size)}</span>
                        <span>${t.status === 'downloading' ? formatSpeed(t.speed) : ''}</span>
                    </div>

                    <div class="task-footer">
                        <span style="font-size: 0.7rem; color: var(--danger); font-weight: 700;">${t.error || ''}</span>
                        <div style="display: flex; gap: 6px;">
                            ${t.status === 'downloading' ? `
                                <button class="btn-action" onclick="pauseTask('${t.id}')">
                                    <i data-lucide="pause" style="width: 12px; height: 12px;"></i> Pause
                                </button>
                            ` : ''}
                            ${t.status === 'paused' || t.status === 'error' ? `
                                <button class="btn-action" onclick="resumeTask('${t.id}')">
                                    <i data-lucide="play" style="width: 12px; height: 12px;"></i> Resume
                                </button>
                            ` : ''}
                            ${t.status === 'completed' ? `
                                <button class="btn-action" onclick="openLocation('${t.id}')">
                                    <i data-lucide="folder" style="width: 12px; height: 12px;"></i> Open
                                </button>
                            ` : ''}
                            <button class="btn-action" style="color: var(--danger);" onclick="deleteTask('${t.id}')">
                                <i data-lucide="trash-2" style="width: 12px; height: 12px;"></i>
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        async function submitDownload() {
            const input = document.getElementById('urlInput');
            const url = (input.value || '').trim();
            if (!url) return;

            if (window.pclink && window.pclink.ui) pclink.ui.haptic('selection');

            try {
                await fetch('./downloads/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url }),
                    credentials: 'include'
                });
                input.value = '';
                fetchTasks();
            } catch (e) {
                console.error("Download failed to initiate:", e);
            }
        }

        async function pauseTask(id) {
            if (window.pclink && window.pclink.ui) pclink.ui.haptic('selection');
            await fetch(`./downloads/pause/${id}`, { method: 'POST', credentials: 'include' });
            fetchTasks();
        }

        async function resumeTask(id) {
            if (window.pclink && window.pclink.ui) pclink.ui.haptic('selection');
            await fetch(`./downloads/resume/${id}`, { method: 'POST', credentials: 'include' });
            fetchTasks();
        }

        async function deleteTask(id) {
            if (window.pclink && window.pclink.ui) pclink.ui.haptic('error');
            await fetch(`./downloads/${id}`, { method: 'DELETE', credentials: 'include' });
            fetchTasks();
        }

        async function openLocation(id) {
            await fetch(`./downloads/open-location/${id}`, { method: 'POST', credentials: 'include' });
        }

        async function pauseAll() {
            await fetch('./downloads/pause-all', { method: 'POST', credentials: 'include' });
            fetchTasks();
        }

        async function resumeAll() {
            await fetch('./downloads/resume-all', { method: 'POST', credentials: 'include' });
            fetchTasks();
        }

        async function clearCompleted() {
            await fetch('./downloads/clear-completed', { method: 'POST', credentials: 'include' });
            fetchTasks();
        }

        lucide.createIcons();
        fetchConfig();
        fetchTasks();
        setInterval(fetchTasks, 3500);
    </script>
</body>
</html>
