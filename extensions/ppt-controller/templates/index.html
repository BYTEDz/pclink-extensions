<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Slideshow Master</title>

    <!-- PCLink Unified Host Broker SDK -->
    <script src="/extensions/sdk/pclink-sdk.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-muted: rgba(37, 99, 235, 0.2);
            --primary-faint: rgba(37, 99, 235, 0.08);
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --bg: #0b1120;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --danger-faint: rgba(239, 68, 68, 0.1);
            --card-border: 1px solid rgba(255, 255, 255, 0.08);
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            --radius: 16px;
        }

        :root[data-theme="light"] {
            --bg: #f8fafc;
            --surface: rgba(0, 0, 0, 0.04);
            --surface-hover: rgba(0, 0, 0, 0.08);
            --text: #0f172a;
            --text-muted: #64748b;
            --card-border: 1px solid rgba(0, 0, 0, 0.08);
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
            user-select: none;
        }

        body {
            padding: 16px;
            padding-top: calc(16px + var(--safe-area-inset-top, 0px));
            padding-bottom: calc(16px + var(--safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slide-card {
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, var(--primary), var(--primary-muted));
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--card-shadow);
            border: var(--card-border);
            position: relative;
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1);
        }

        .slide-card:active {
            transform: scale(0.98);
        }

        .slide-card svg {
            color: white;
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
            opacity: 0.95;
        }

        .slide-hint {
            position: absolute;
            bottom: 12px;
            right: 14px;
            color: white;
            font-size: 0.65rem;
            font-weight: 900;
            opacity: 0.8;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .nav-card {
            background: var(--surface);
            border: var(--card-border);
            border-radius: var(--radius);
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text);
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1), background 0.15s ease;
            box-shadow: var(--card-shadow);
        }

        .nav-card:active {
            transform: scale(0.96);
            background: var(--surface-hover);
        }

        .nav-card svg {
            width: 24px;
            height: 24px;
            color: var(--primary);
        }

        .nav-card.primary {
            background: var(--primary-faint);
            border-color: var(--primary);
        }

        .actions-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .action-card {
            background: var(--surface);
            border: var(--card-border);
            border-radius: var(--radius);
            padding: 12px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--text);
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1), background 0.15s ease;
            box-shadow: var(--card-shadow);
        }

        .action-card:active {
            transform: scale(0.94);
            background: var(--surface-hover);
        }

        .action-card svg {
            width: 18px;
            height: 18px;
            color: var(--text-muted);
        }

        .action-card.danger {
            color: var(--danger);
            background: var(--danger-faint);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .action-card.danger svg {
            color: var(--danger);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main Slide Viewport Target -->
        <div class="slide-card" onclick="control('next')">
            <i data-lucide="presentation"></i>
            <span class="slide-hint">Next Slide →</span>
        </div>

        <!-- Primary Navigation Controls -->
        <div class="nav-grid">
            <div class="nav-card" onclick="control('prev')">
                <i data-lucide="chevron-left"></i>
                Previous
            </div>
            <div class="nav-card primary" onclick="control('next')">
                <i data-lucide="chevron-right"></i>
                Next
            </div>
        </div>

        <!-- Secondary Playback Controls -->
        <div class="nav-grid">
            <div class="nav-card" onclick="control('start_current')">
                <i data-lucide="play"></i>
                Resume
            </div>
            <div class="nav-card" onclick="control('start')">
                <i data-lucide="monitor-play"></i>
                Start (F5)
            </div>
        </div>

        <!-- Presentation Utility Controls -->
        <div class="actions-row">
            <div class="action-card" onclick="control('black')">
                <i data-lucide="monitor-dot"></i>
                Black
            </div>
            <div class="action-card" onclick="control('white')">
                <i data-lucide="maximize"></i>
                White
            </div>
            <div class="action-card" onclick="control('laser')">
                <i data-lucide="mouse-pointer-2"></i>
                Laser
            </div>
            <div class="action-card danger" onclick="control('stop')">
                <i data-lucide="power"></i>
                Exit
            </div>
        </div>
    </div>

    <script>
        const ACTION_MAP = {
            'next': async () => pclink.input.pressKey('right'),
            'prev': async () => pclink.input.pressKey('left'),
            'start': async () => pclink.input.pressKey('f5'),
            'start_current': async () => pclink.input.pressKey('f5', ['shift']),
            'stop': async () => pclink.input.pressKey('esc'),
            'black': async () => pclink.input.pressKey('b'),
            'white': async () => pclink.input.pressKey('w'),
            'laser': async () => pclink.input.pressKey('l', ['ctrl'])
        };

        async function control(action) {
            if (window.pclink && window.pclink.ui) {
                pclink.ui.haptic(action === 'stop' ? 'error' : 'selection');
            }

            const handler = ACTION_MAP[action];
            if (handler && window.pclink && window.pclink.input) {
                try {
                    await handler();
                } catch (e) {
                    console.error(`Action '${action}' failed:`, e);
                }
            }
        }

        lucide.createIcons();
    </script>
</body>
</html>
