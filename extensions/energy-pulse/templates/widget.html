<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PCLink Unified Host Broker SDK -->
    <script src="/extensions/sdk/pclink-sdk.js"></script>

    <style>
        :root {
            --bg: transparent;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-muted: rgba(59, 130, 246, 0.2);
            --on-primary: #ffffff;
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --card-border: 1px solid rgba(255, 255, 255, 0.08);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 6px 8px;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .widget-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: var(--surface);
            border-radius: var(--radius);
            border: var(--card-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-svg {
            width: 20px;
            height: 20px;
            fill: var(--primary);
        }

        .label { font-size: 13px; font-weight: 700; }
        .value { font-size: 11px; color: var(--text-muted); font-weight: 600; }

        .modes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .mode-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 2px;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: calc(var(--radius) * 0.8);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            color: var(--text-muted);
        }

        .mode-btn:active { transform: scale(0.94); }

        .mode-btn.active {
            background: var(--primary);
            color: var(--on-primary);
            border-color: var(--primary);
            box-shadow: 0 4px 12px var(--primary-muted);
        }

        .mode-btn.active .icon-svg {
            fill: var(--on-primary);
        }

        .mode-icon-svg { width: 18px; height: 18px; fill: var(--text-muted); }
        .mode-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <div class="widget-container">
        <div class="status-row">
            <div class="info">
                <svg class="icon-svg" id="bat-icon" viewBox="0 0 24 24">
                    <path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.34C7 21.4 7.6 22 8.33 22h7.34c.74 0 1.33-.6 1.33-1.33V5.33C17 4.6 16.4 4 15.67 4z"/>
                </svg>
                <div>
                    <div class="label" id="power-status">Detecting...</div>
                    <div class="value" id="battery-pct">--%</div>
                </div>
            </div>
            <span style="font-size: 10px; font-weight: 800; opacity: 0.4; text-transform: uppercase;">Linux</span>
        </div>

        <div class="modes-grid">
            <div class="mode-btn" onclick="setPlan('power-saver')" id="plan-saver">
                <svg class="icon-svg mode-icon-svg" viewBox="0 0 24 24">
                    <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
                </svg>
                <span class="mode-label">Saver</span>
            </div>
            <div class="mode-btn" onclick="setPlan('balanced')" id="plan-balanced">
                <svg class="icon-svg mode-icon-svg" viewBox="0 0 24 24">
                    <path d="M13 11V5h-2v6H5v2h6v6h2v-6h6v-2z"/>
                </svg>
                <span class="mode-label">Auto</span>
            </div>
            <div class="mode-btn" onclick="setPlan('performance')" id="plan-high">
                <svg class="icon-svg mode-icon-svg" viewBox="0 0 24 24">
                    <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
                </svg>
                <span class="mode-label">Turbo</span>
            </div>
        </div>
    </div>

    <script>
        async function refreshStatus() {
            try {
                const sysRes = await fetch('/info/system', { credentials: 'include' });
                if (sysRes.ok) {
                    const sysData = await sysRes.json();
                    const hasBattery = sysData.battery && sysData.battery.percent !== undefined;
                    document.getElementById('power-status').innerText = hasBattery ? (sysData.battery.power_plugged ? "AC Power" : "On Battery") : "AC Power";
                    document.getElementById('battery-pct').innerText = hasBattery ? (Math.round(sysData.battery.percent) + '%') : "Desktop";
                }

                if (window.pclink && window.pclink.system) {
                    const res = await pclink.system.exec({ command: 'powerprofilesctl get' });
                    if (res.exit_code === 0 && res.stdout) {
                        const plan = res.stdout.trim();
                        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
                        let activeId = 'plan-balanced';
                        if (plan === 'power-saver') activeId = 'plan-saver';
                        else if (plan === 'performance') activeId = 'plan-high';
                        const el = document.getElementById(activeId);
                        if (el) el.classList.add('active');
                    }
                }
            } catch (e) {}
        }

        async function setPlan(planName) {
            if (window.pclink && window.pclink.ui) {
                pclink.ui.haptic('selection');
            }

            try {
                if (window.pclink && window.pclink.system) {
                    await pclink.system.exec({ command: `powerprofilesctl set ${planName}` });
                    await refreshStatus();
                }
            } catch(e) {}
        }

        setInterval(refreshStatus, 8000);
        refreshStatus();
    </script>
</body>
</html>
