<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PCLink Unified Host Broker SDK -->
    <script src="/extensions/sdk/pclink-sdk.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --bg: transparent;
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.1);
            --radius: 12px;
        }

        :root[data-theme="light"] {
            --text: #0f172a;
            --text-muted: rgba(0, 0, 0, 0.5);
            --surface: rgba(0, 0, 0, 0.04);
            --surface-hover: rgba(0, 0, 0, 0.08);
        }

        body {
            margin: 0;
            padding: 8px;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .media-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 8px;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1), background 0.15s;
            background: transparent;
            border: none;
            color: inherit;
        }

        .btn:active {
            background: var(--surface-hover);
            transform: scale(0.88);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .icon-svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .volume-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .vol-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 38px;
            background: var(--surface);
            border-radius: calc(var(--radius) * 0.75);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .vol-btn:active {
            background: var(--surface-hover);
            transform: scale(0.96);
        }

        .vol-icon-svg {
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="media-container">
        <!-- Transport Navigation Row -->
        <div class="control-row">
            <button class="btn" onclick="control('prev')" aria-label="Previous Track">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="btn btn-primary" onclick="control('play_pause')" id="play-btn" aria-label="Play or Pause">
                <svg class="icon-svg" viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="btn" onclick="control('next')" aria-label="Next Track">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>

        <!-- Master Volume Quick Controls -->
        <div class="volume-row">
            <button class="vol-btn" onclick="control('vol_down')">
                <svg class="vol-icon-svg" viewBox="0 0 24 24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
                Down
            </button>
            <button class="vol-btn" onclick="control('vol_up')">
                <svg class="vol-icon-svg" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                Up
            </button>
        </div>
    </div>

    <script>
        async function control(action) {
            if (window.pclink && window.pclink.ui) {
                pclink.ui.haptic('selection');
            }

            try {
                if (action === 'play_pause') {
                    await pclink.media.playPause();
                } else if (action === 'next') {
                    await pclink.media.next();
                } else if (action === 'prev') {
                    await pclink.media.previous();
                } else if (action === 'vol_up') {
                    await pclink.media.command('vol_up');
                } else if (action === 'vol_down') {
                    await pclink.media.command('vol_down');
                }
            } catch (e) {
                console.error("Widget media command error:", e);
            }
        }
    </script>
</body>
</html>
