<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Network Guard</title>

    <!-- PCLink Unified Host Broker SDK -->
    <script src="/extensions/sdk/pclink-sdk.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: #0b1120;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-muted: rgba(59, 130, 246, 0.15);
            --secondary: #06b6d4;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --danger-muted: rgba(239, 68, 68, 0.15);
            --warning: #f59e0b;
            --warning-muted: rgba(245, 158, 11, 0.15);
            --success: #10b981;
            --card-border: 1px solid rgba(255, 255, 255, 0.08);
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            --radius: 16px;
        }

        :root[data-theme="light"] {
            --bg: #f8fafc;
            --surface: rgba(0, 0, 0, 0.04);
            --surface-hover: rgba(0, 0, 0, 0.08);
            --text: #0f172a;
            --text-muted: #64748b;
            --card-border: 1px solid rgba(0, 0, 0, 0.08);
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 16px;
            padding-top: calc(16px + var(--safe-area-inset-top, 0px));
            padding-bottom: calc(16px + var(--safe-area-inset-bottom, 0px));
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            gap: 16px;
            user-select: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.25rem;
            margin: 0;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }

        .badge-live {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 8px;
            border-radius: 8px;
            background: var(--primary-muted);
            color: var(--primary);
            border: var(--card-border);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .speed-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background: var(--surface);
            padding: 16px;
            border-radius: var(--radius);
            border: var(--card-border);
            box-shadow: var(--card-shadow);
        }

        .speed-card {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .speed-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .speed-value {
            font-size: 1.5rem;
            font-weight: 900;
            font-family: 'JetBrains Mono', 'SF Mono', monospace;
            letter-spacing: -0.5px;
        }

        .speed-unit {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-left: 4px;
            font-weight: 700;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .app-item {
            background: var(--surface);
            padding: 12px 14px;
            border-radius: var(--radius);
            border: var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: background 0.15s ease;
        }

        .app-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }

        .app-name {
            font-weight: 800;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-details {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-action {
            background: var(--surface-hover);
            border: var(--card-border);
            color: var(--text);
            width: 34px;
            height: 34px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease, background 0.15s ease;
        }

        .btn-action:active {
            transform: scale(0.92);
        }

        .btn-warning {
            color: var(--warning);
            background: var(--warning-muted);
        }

        .btn-danger {
            color: var(--danger);
            background: var(--danger-muted);
        }

        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: var(--radius);
            border: var(--card-border);
            background: var(--surface);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <i data-lucide="shield-check" style="width: 20px; height: 20px; color: var(--primary);"></i>
            Network Guard
        </h1>
        <div class="badge-live" id="statusBadge">
            <span class="badge-dot"></span>
            <span id="statusText">LIVE</span>
        </div>
    </div>

    <div class="speed-grid">
        <div class="card speed-card">
            <span class="speed-label">
                <i data-lucide="arrow-down" style="width: 14px; height: 14px; color: var(--secondary);"></i>
                Download
            </span>
            <div class="speed-value" id="downSpeed">0.0<span class="speed-unit">KB/s</span></div>
        </div>
        <div class="card speed-card">
            <span class="speed-label">
                <i data-lucide="arrow-up" style="width: 14px; height: 14px; color: var(--primary);"></i>
                Upload
            </span>
            <div class="speed-value" id="upSpeed">0.0<span class="speed-unit">KB/s</span></div>
        </div>
    </div>

    <div class="section-title">Active Sockets</div>

    <div class="list-container" id="appList">
        <div class="empty-state">Inspecting active network connections...</div>
    </div>

    <script>
        function formatSpeed(kb) {
            if (kb > 1024) return (kb / 1024).toFixed(1);
            return kb.toFixed(1);
        }

        async function fetchStatus() {
            try {
                const res = await fetch('./status', { credentials: 'include' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                updateUI(data);
                document.getElementById('statusText').innerText = 'LIVE';
            } catch (err) {
                document.getElementById('statusText').innerText = 'OFFLINE';
            }
        }

        function updateUI(data) {
            const downUnit = data.speed.down > 1024 ? 'MB/s' : 'KB/s';
            const upUnit = data.speed.up > 1024 ? 'MB/s' : 'KB/s';

            document.getElementById('downSpeed').innerHTML = `${formatSpeed(data.speed.down)}<span class="speed-unit">${downUnit}</span>`;
            document.getElementById('upSpeed').innerHTML = `${formatSpeed(data.speed.up)}<span class="speed-unit">${upUnit}</span>`;

            const list = document.getElementById('appList');
            if (!data.apps || data.apps.length === 0) {
                list.innerHTML = '<div class="empty-state">No active network processes detected.</div>';
                return;
            }

            list.innerHTML = data.apps.map(app => {
                const isSuspended = app.status === 'stopped' || app.status === 'suspended';
                const actionType = isSuspended ? 'resume' : 'suspend';
                const actionIcon = isSuspended ? 'play' : 'pause';

                return `
                <div class="app-item">
                    <div class="app-info">
                        <span class="app-name">${app.name}</span>
                        <span class="app-details">${app.conn_count} Sockets • PID: ${app.pid}</span>
                    </div>
                    <div class="actions">
                        <button class="btn-action btn-warning" onclick="sendAction(${app.pid}, '${actionType}')" title="${isSuspended ? 'Resume' : 'Suspend'}">
                            <i data-lucide="${actionIcon}" style="width: 16px; height: 16px;"></i>
                        </button>
                        <button class="btn-action btn-danger" onclick="sendAction(${app.pid}, 'kill')" title="Terminate Process">
                            <i data-lucide="x" style="width: 16px; height: 16px;"></i>
                        </button>
                    </div>
                </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        async function sendAction(pid, action) {
            if (window.pclink && window.pclink.ui) {
                pclink.ui.haptic(action === 'kill' ? 'error' : 'selection');
            }

            try {
                const res = await fetch('./action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pid, action }),
                    credentials: 'include'
                });
                if (res.ok) {
                    await fetchStatus();
                } else {
                    const err = await res.json().catch(() => ({ detail: 'Action failed' }));
                    if (window.pclink && window.pclink.notifications) {
                        pclink.notifications.show('Network Guard', err.detail || 'Action failed', 'error');
                    }
                }
            } catch (err) {
                console.error("Action error:", err);
            }
        }

        lucide.createIcons();
        setInterval(fetchStatus, 1500);
        fetchStatus();
    </script>
</body>
</html>
