<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PCLink Unified Host Broker SDK -->
    <script src="/extensions/sdk/pclink-sdk.js"></script>

    <style>
        :root {
            --primary: #2496ed;
            --primary-muted: rgba(36, 150, 237, 0.2);
            --bg: transparent;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --card-border: 1px solid rgba(255, 255, 255, 0.08);
            --radius: 12px;
        }

        :root[data-theme="light"] {
            --text: #0f172a;
            --text-muted: rgba(0, 0, 0, 0.5);
            --surface: rgba(0, 0, 0, 0.04);
            --card-border: 1px solid rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 6px 8px;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .widget-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .status-header {
            background: var(--surface);
            border-radius: var(--radius);
            border: var(--card-border);
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .main-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon {
            width: 18px;
            height: 18px;
            fill: var(--primary);
        }

        .count {
            font-size: 14px;
            font-weight: 800;
        }

        .label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .health-bar {
            height: 4px;
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            margin: 0 2px;
        }

        .health-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
            width: 0%;
            border-radius: var(--radius);
        }

        .shortcut-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .btn-quick {
            background: var(--surface);
            border: var(--card-border);
            border-radius: calc(var(--radius) * 0.75);
            padding: 7px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            transition: transform 0.1s ease;
            color: var(--text);
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .btn-quick:active {
            transform: scale(0.95);
            background: var(--surface-hover);
        }
    </style>
</head>
<body>
    <div class="widget-box">
        <div class="status-header">
            <div class="main-info">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M13.983 11.078h2.119c.102 0 .186-.084.186-.186V8.773a.186.186 0 00-.186-.186h-2.119a.185.185 0 00-.185.186v2.119c0 .102.083.186.185.186m-2.954-2.305h2.119a.186.186 0 00.185-.186V6.468a.186.186 0 00-.185-.186h-2.119a.185.185 0 00-.185.186v2.119c0 .102.083.186.185.186m0 2.305h2.119c.102 0 .185-.084.185-.186V8.773a.186.186 0 00-.185-.186h-2.119a.186.186 0 00-.186.186v2.119c0 .102.084.186.186.186m-2.954-2.305h2.119a.186.186 0 00.186-.186V6.468a.185.185 0 00-.186-.186h-2.119a.186.186 0 00-.186.186v2.119c0 .102.084.186.186.186m0 2.305h2.119c.102 0 .186-.084.186-.186V8.773a.186.186 0 00-.186-.186h-2.119a.185.185 0 00-.185.186v2.119c0 .102.083.186.185.186m-2.954-2.305h2.119a.185.185 0 00.185-.186V6.468a.185.185 0 00-.185-.186h-2.119a.186.186 0 00-.186.186v2.119c0 .102.084.186.186.186m0 2.305h2.119c.102 0 .186-.084.186-.186V8.773a.186.186 0 00-.186-.186h-2.119a.185.185 0 00-.185.186v2.119c0 .102.083.186.185.186m-2.954-2.305h2.119a.185.185 0 00.185-.186V6.468a.185.185 0 00-.185-.186h-2.119a.186.186 0 00-.186.186v2.119c0 .102.084.186.186.186m-2.954 2.305h2.119c.102 0 .185-.084.185-.186V8.773a.186.186 0 00-.185-.186h-2.119a.186.186 0 00-.186.186v2.119c0 .102.084.186.186.186zM21.007 12.11c-.569 0-1.03.46-1.03 1.03 0 .18.065.344.148.498-1.247.762-2.327.57-2.423.553-.047-.01-.114-.01-.189-.01h-.034c-.202 0-.317.07-.389.13-.039.034-.148.131-.148.452l-.001.039c-.015.632.709 1.144 1.157 1.402.128.074.205.145.205.289 0 .141-.079.21-.21.289-.512.303-1.605.959-1.605 2.122 0 1.077.926 1.868 2.11 1.868 3.705 0 6.22-3.003 6.22-6.104 0-1.428-.567-2.568-1.811-2.568"/>
                </svg>
                <div>
                    <div class="label">Vessels</div>
                    <div style="display: flex; align-items: baseline; gap: 4px;">
                        <span id="count" class="count">--</span>
                        <span style="font-size: 10px; opacity: 0.5;">/ <span id="total">--</span></span>
                    </div>
                </div>
            </div>
            <span style="font-size: 9px; font-weight: 800; opacity: 0.4;">FLEET</span>
        </div>

        <div class="health-bar">
            <div class="health-fill" id="fill"></div>
        </div>

        <div class="shortcut-grid">
            <button class="btn-quick" onclick="bulk('start')">Start</button>
            <button class="btn-quick" onclick="bulk('restart')">Restart</button>
            <button class="btn-quick" onclick="bulk('stop')">Stop</button>
            <button class="btn-quick" style="color:var(--danger)" onclick="prune()">Prune</button>
        </div>
    </div>

    <script>
        const apiPath = window.location.pathname.replace(/\/widget\/[^\/]+$/, '').replace(/\/ui$/, '');

        async function refresh() {
            try {
                const res = await fetch(`${apiPath}/status`, { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    if (data.connected) {
                        document.getElementById('count').innerText = data.running;
                        document.getElementById('total').innerText = data.total;
                        const pct = data.total > 0 ? (data.running / data.total) * 100 : 0;
                        document.getElementById('fill').style.width = pct + '%';
                    }
                }
            } catch (e) {}
        }

        async function bulk(action) {
            if (window.pclink && window.pclink.ui) pclink.ui.haptic('selection');
            await fetch(`${apiPath}/containers/bulk/${action}`, { method: 'POST', credentials: 'include' });
            refresh();
        }

        async function prune() {
            if (confirm("Deep clean system? (Removes all unattached Containers, Networks, Volumes & Images)")) {
                if (window.pclink && window.pclink.ui) pclink.ui.haptic('error');
                await fetch(`${apiPath}/system/prune`, { method: 'POST', credentials: 'include' });
                refresh();
            }
        }

        refresh();
        setInterval(refresh, 6000);
    </script>
</body>
</html>
