<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Vessel Forge</title>

    <!-- PCLink Unified Host Broker SDK -->
    <script src="/extensions/sdk/pclink-sdk.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: transparent;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --primary: #2496ed;
            --primary-muted: rgba(36, 150, 237, 0.18);
            --on-primary: #ffffff;
            --text: #f8fafc;
            --text-muted: rgba(248, 250, 252, 0.6);
            --danger: #ef4444;
            --success: #10b981;
            --card-border: 1px solid rgba(255, 255, 255, 0.08);
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            --radius: 16px;
        }

        :root[data-theme="light"] {
            --surface: rgba(0, 0, 0, 0.04);
            --surface-hover: rgba(0, 0, 0, 0.07);
            --text: #0f172a;
            --text-muted: #64748b;
            --card-border: 1px solid rgba(0, 0, 0, 0.08);
            --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background: transparent !important;
            background-color: transparent !important;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            padding: 16px;
            padding-top: calc(16px + var(--safe-area-inset-top, 0px));
            padding-bottom: calc(24px + var(--safe-area-inset-bottom, 0px));
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .tabs-nav {
            display: flex;
            background: var(--surface);
            padding: 4px;
            border-radius: var(--radius);
            border: var(--card-border);
            overflow-x: auto;
            scrollbar-width: none;
            gap: 4px;
        }

        .tabs-nav::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 12px;
            border: none;
            background: none;
            color: var(--text-muted);
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-radius: calc(var(--radius) * 0.75);
            transition: 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--primary);
            color: var(--on-primary);
            box-shadow: 0 4px 12px var(--primary-muted);
        }

        .search-field {
            width: 100%;
            padding: 12px 14px;
            background: var(--surface);
            border: var(--card-border);
            border-radius: var(--radius);
            color: var(--text);
            font-weight: 600;
            font-size: 0.85rem;
            outline: none;
            transition: 0.2s;
        }

        .search-field:focus {
            border-color: var(--primary);
        }

        .card {
            background: var(--surface);
            border: var(--card-border);
            border-radius: var(--radius);
            padding: 16px;
            position: relative;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .status-badge {
            font-size: 0.65rem;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-running {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-exited {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .container-name {
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: -0.2px;
        }

        .container-image {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .details-grid {
            margin-top: 8px;
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding-top: 10px;
            border-top: var(--card-border);
        }

        .details-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .details-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .details-value {
            font-size: 0.75rem;
            font-weight: 600;
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            border-top: var(--card-border);
            padding-top: 10px;
        }

        .btn-sm {
            background: var(--surface-hover);
            border: var(--card-border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: calc(var(--radius) * 0.6);
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            font-weight: 700;
            font-size: 0.75rem;
        }

        .btn-sm:active {
            transform: scale(0.96);
            background: var(--primary-muted);
            color: var(--primary);
        }

        .btn-nuke:active {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-pro {
            width: 100%;
            padding: 12px;
            background: var(--surface-hover);
            border: var(--card-border);
            border-radius: calc(var(--radius) * 0.75);
            color: var(--text);
            font-weight: 600;
            font-size: 0.85rem;
            outline: none;
        }

        .input-pro:focus {
            border-color: var(--primary);
        }

        textarea.input-pro {
            min-height: 140px;
            font-family: monospace;
            font-size: 0.75rem;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            border: none;
            border-radius: var(--radius);
            color: var(--on-primary);
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.15s;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .template-chip {
            font-size: 0.7rem;
            background: var(--surface-hover);
            border: var(--card-border);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.15s;
        }

        .template-chip:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        #log-view {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 16px;
            padding-top: calc(16px + var(--safe-area-inset-top, 0px));
            padding-bottom: calc(16px + var(--safe-area-inset-bottom, 0px));
            flex-direction: column;
        }

        pre#logText {
            flex: 1;
            overflow: auto;
            color: #10b981;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            margin-top: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            border: var(--card-border);
        }

        .toast {
            position: fixed;
            bottom: calc(20px + var(--safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: var(--on-primary);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 800;
            font-size: 0.8rem;
            z-index: 300;
            pointer-events: none;
            opacity: 0;
            transition: 0.3s;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="container">
        <nav class="tabs-nav">
            <button class="tab-btn active" id="btn-containers" onclick="switchTab('containers')">
                <i data-lucide="layers" style="width: 14px; height: 14px;"></i> Fleet
            </button>
            <button class="tab-btn" id="btn-deploy" onclick="switchTab('deploy')">
                <i data-lucide="rocket" style="width: 14px; height: 14px;"></i> Run
            </button>
            <button class="tab-btn" id="btn-images" onclick="switchTab('images')">
                <i data-lucide="package" style="width: 14px; height: 14px;"></i> Images
            </button>
            <button class="tab-btn" id="btn-volumes" onclick="switchTab('volumes')">
                <i data-lucide="hard-drive" style="width: 14px; height: 14px;"></i> Vols
            </button>
            <button class="tab-btn" id="btn-networks" onclick="switchTab('networks')">
                <i data-lucide="network" style="width: 14px; height: 14px;"></i> Nets
            </button>
        </nav>

        <div id="active-tasks"></div>

        <div id="view-containers">
            <input type="text" id="search" class="search-field" placeholder="Search container fleet..." oninput="refresh()">
            <div id="containerList" style="display: flex; flex-direction: column; gap: 10px; margin-top: 14px;"></div>
        </div>

        <div id="view-deploy" style="display: none">
            <div class="card">
                <div style="display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;">
                    <div class="template-chip" onclick="loadTemplate('nginx')">Nginx</div>
                    <div class="template-chip" onclick="loadTemplate('mariadb')">MariaDB</div>
                    <div class="template-chip" onclick="loadTemplate('redis')">Redis</div>
                    <div class="template-chip" onclick="loadTemplate('portainer')">Portainer</div>
                </div>
                <div class="input-group">
                    <input type="text" id="run-image" class="input-pro" placeholder="Image:tag (e.g. nginx:alpine)">
                    <input type="text" id="run-name" class="input-pro" placeholder="Container Name">
                    <input type="text" id="run-ports" class="input-pro" placeholder="Host Port:Container Port (8080:80)">
                    <input type="text" id="run-volumes" class="input-pro" placeholder="Host Path:Container Path (/data:/app/data)">
                    <input type="text" id="run-env" class="input-pro" placeholder="ENV Variables (KEY=value, ENV=prod)">
                    <select id="run-restart" class="input-pro">
                        <option value="no">Restart: No</option>
                        <option value="always">Restart: Always</option>
                        <option value="unless-stopped">Restart: Unless Stopped</option>
                    </select>
                    <textarea id="run-json" class="input-pro" placeholder="Advanced JSON Config" style="display:none"></textarea>
                    <button class="btn-sm" onclick="toggleAdv()" style="font-size: 0.7rem; color: var(--text-muted); border: none; background: transparent; padding: 0; justify-content: flex-end;">Switch Advanced JSON Mode</button>
                </div>
                <button class="btn-primary" id="launch-btn" onclick="deployContainer()">Ignite Container</button>
            </div>
        </div>

        <div id="view-images" style="display: none">
            <div style="display: flex; gap: 8px;">
                <input type="text" id="pull-input" class="search-field" style="flex:1" placeholder="Image to pull (e.g. redis:alpine)...">
                <button class="btn-sm" style="flex:0; width:50px; background:var(--primary); color:#fff; border:none;" onclick="pullImg()">
                    <i data-lucide="download" style="width: 16px; height: 16px;"></i>
                </button>
            </div>
            <div id="imageList" style="display: flex; flex-direction: column; gap: 8px; margin-top: 14px;"></div>
        </div>

        <div id="view-volumes" style="display: none">
            <div id="volumeList" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

        <div id="view-networks" style="display: none">
            <div id="networkList" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
    </div>

    <!-- Logs Viewer Overlay -->
    <div id="log-view">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: var(--card-border); padding-bottom: 12px;">
            <h4 id="log-title" style="margin:0; font-weight: 800;">Container Logs</h4>
            <button class="btn-sm" style="flex:0; padding:6px 14px;" onclick="closeLogs()">Close</button>
        </div>
        <pre id="logText">Connecting to container log stream...</pre>
    </div>

    <div id="toast" class="toast">Action completed</div>

    <script>
        let currentTab = 'containers';
        let expanded = new Set();

        function showToast(msg) {
            if (window.pclink && window.pclink.ui) pclink.ui.haptic('selection');
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function switchTab(t) {
            if (window.pclink && window.pclink.ui) pclink.ui.haptic('selection');
            currentTab = t;
            ['containers', 'deploy', 'images', 'volumes', 'networks'].forEach(v => {
                document.getElementById(`view-${v}`).style.display = v === t ? 'block' : 'none';
                document.getElementById(`btn-${v}`).classList.toggle('active', v === t);
            });
            refresh();
        }

        function toggleAdv() {
            const json = document.getElementById('run-json');
            const fields = ['run-image', 'run-name', 'run-ports', 'run-volumes', 'run-env', 'run-restart'];
            const isColl = json.style.display === 'none';
            json.style.display = isColl ? 'block' : 'none';
            fields.forEach(f => document.getElementById(f).style.display = isColl ? 'none' : 'block');
        }

        function loadTemplate(type) {
            const templates = {
                nginx: { image: "nginx:alpine", name: "web-server", ports: { "80/tcp": 8080 } },
                mariadb: { image: "mariadb:lts", name: "db-node", environment: ["MYSQL_ROOT_PASSWORD=secret"], ports: { "3306/tcp": 3306 } },
                redis: { image: "redis:alpine", name: "cache-node", ports: { "6379/tcp": 6379 } },
                portainer: { image: "portainer/portainer-ce:latest", name: "portainer", ports: { "9000/tcp": 9000 }, volumes: { "/var/run/docker.sock": { "bind": "/var/run/docker.sock", "mode": "rw" } } }
            };
            const config = templates[type];
            if (document.getElementById('run-json').style.display === 'block') {
                document.getElementById('run-json').value = JSON.stringify(config, null, 2);
            } else {
                document.getElementById('run-image').value = config.image;
                document.getElementById('run-name').value = config.name;
                document.getElementById('run-ports').value = Object.entries(config.ports || {}).map(([p, h]) => `${h}:${p.split('/')[0]}`).join(",");
                document.getElementById('run-env').value = (config.environment || []).join(",");
                document.getElementById('run-volumes').value = Object.entries(config.volumes || {}).map(([p, v]) => `${p}:${v.bind}`).join(",");
            }
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB', 'GB', 'TB'], i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, Math.max(1, i))).toFixed(2)) + ' ' + sizes[Math.max(1, i)];
        }

        async function refresh() {
            try {
                const search = (document.getElementById('search')?.value || '').toLowerCase().trim();
                const resStatus = await fetch('./status', { credentials: 'include' });
                if (!resStatus.ok) return;
                const status = await resStatus.json();

                const tasks = document.getElementById('active-tasks');
                tasks.innerHTML = "";
                const active = { ...status.pulling, ...status.deploying };
                Object.keys(active).forEach(t => {
                    tasks.innerHTML += `<div class="card" style="padding:10px; background:var(--primary-muted); border-color:var(--primary);"><div style="display:flex; justify-content:space-between; font-size:0.75rem; font-weight:800;"><span>${t.toUpperCase()}</span><span>${active[t]}</span></div></div>`;
                });

                if (currentTab === 'containers') {
                    const res = await fetch('./containers', { credentials: 'include' });
                    if (!res.ok) return;
                    let data = await res.json();
                    data = data.filter(c => c.name.toLowerCase().includes(search) || (c.image || '').toLowerCase().includes(search));
                    data.sort((a, b) => a.name.localeCompare(b.name));

                    const list = document.getElementById('containerList');
                    list.innerHTML = data.map(c => `
                        <div class="card">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start; cursor:pointer;" onclick="toggleDetails('${c.id}', '${c.status}')">
                                <div>
                                    <div class="container-name">${c.name}</div>
                                    <div class="container-image">${c.image}</div>
                                </div>
                                <span class="status-badge status-${c.status === 'running' ? 'running' : 'exited'}">${c.status}</span>
                            </div>
                            <div class="details-grid" id="details-${c.id}" style="display:${expanded.has(c.id) ? 'grid' : 'none'}">
                                <div class="details-item" style="grid-column: span 2" id="stats-${c.id}"></div>
                                <div class="details-item"><span class="details-label">ID</span><span class="details-value">${c.id}</span></div>
                                <div class="details-item"><span class="details-label">Ports</span><span class="details-value">${Object.entries(c.ports || {}).map(([p, v]) => `${v ? v[0].HostPort : ''}->${p}`).join(", ") || 'N/A'}</span></div>
                                <div class="details-item" style="grid-column: span 2"><span class="details-label">Networks</span><span class="details-value">${(c.networks || []).join(", ") || 'bridge'}</span></div>
                            </div>
                            <div class="card-actions">
                                <button class="btn-sm" onclick="action('${c.id}', '${c.status === 'running' ? 'stop' : 'start'}')">${c.status === 'running' ? 'Stop' : 'Start'}</button>
                                <button class="btn-sm" onclick="action('${c.id}', 'restart')">Restart</button>
                                <button class="btn-sm" onclick="viewLogs('${c.id}', '${c.name}')">Logs</button>
                                <button class="btn-sm btn-nuke" style="color:var(--danger)" onclick="deleteContainer('${c.id}', '${c.name}')">Remove</button>
                            </div>
                        </div>
                    `).join('');

                    data.forEach(c => {
                        if (expanded.has(c.id) && c.status === 'running') loadStats(c.id);
                    });
                } else if (currentTab === 'images') {
                    const res = await fetch('./images', { credentials: 'include' });
                    if (!res.ok) return;
                    let data = await res.json();
                    const list = document.getElementById('imageList');
                    list.innerHTML = data.map(img => `
                        <div class="card" style="flex-direction:row; justify-content:space-between; align-items:center;">
                            <div>
                                <div class="container-name">${img.tags[0] || img.id.substring(0, 12)}</div>
                                <div class="container-image">${formatBytes(img.size)}</div>
                            </div>
                            <button class="btn-sm btn-nuke" style="flex:0; padding:6px 12px; color:var(--danger);" onclick="deleteImage('${img.id}')">Delete</button>
                        </div>
                    `).join('');
                } else if (currentTab === 'volumes') {
                    const res = await fetch('./volumes', { credentials: 'include' });
                    if (!res.ok) return;
                    let data = await res.json();
                    const list = document.getElementById('volumeList');
                    list.innerHTML = data.map(v => `
                        <div class="card" style="flex-direction:row; justify-content:space-between; align-items:center;">
                            <div style="overflow:hidden; padding-right:8px;">
                                <div class="container-name" style="text-overflow:ellipsis; overflow:hidden;">${v.name}</div>
                                <div class="container-image">Driver: ${v.driver}</div>
                            </div>
                            <button class="btn-sm btn-nuke" style="flex:0; padding:6px 12px; color:var(--danger);" onclick="deleteVolume('${v.name}')">Delete</button>
                        </div>
                    `).join('');
                } else if (currentTab === 'networks') {
                    const res = await fetch('./networks', { credentials: 'include' });
                    if (!res.ok) return;
                    let data = await res.json();
                    const list = document.getElementById('networkList');
                    list.innerHTML = data.map(n => `
                        <div class="card" style="flex-direction:row; justify-content:space-between; align-items:center;">
                            <div>
                                <div class="container-name">${n.name}</div>
                                <div class="container-image">Driver: ${n.driver}</div>
                            </div>
                            <button class="btn-sm btn-nuke" style="flex:0; padding:6px 12px; color:var(--danger);" onclick="deleteNetwork('${n.id}')">Delete</button>
                        </div>
                    `).join('');
                }
            } catch (e) {}
        }

        async function loadStats(id) {
            const el = document.getElementById(`stats-${id}`);
            if (!el) return;
            try {
                const r = await fetch(`./containers/${id}/stats`, { credentials: 'include' });
                const d = await r.json();
                el.innerHTML = `<span class="details-value" style="color:var(--primary); font-weight:800;">CPU: ${d.cpu}% • RAM: ${formatBytes(d.mem)} / ${formatBytes(d.mem_limit)}</span>`;
            } catch (e) {}
        }

        function toggleDetails(id, status) {
            if (expanded.has(id)) {
                expanded.delete(id);
                const el = document.getElementById(`details-${id}`);
                if (el) el.style.display = 'none';
            } else {
                expanded.add(id);
                const el = document.getElementById(`details-${id}`);
                if (el) el.style.display = 'grid';
                if (status === 'running') loadStats(id);
            }
        }

        async function deployContainer() {
            const btn = document.getElementById('launch-btn');
            btn.innerText = "Deploying...";
            btn.disabled = true;
            let payload;
            if (document.getElementById('run-json').style.display === 'block') {
                try {
                    payload = { mode: 'advanced', config: JSON.parse(document.getElementById('run-json').value) };
                } catch (e) {
                    alert("Invalid JSON format");
                    btn.innerText = "Ignite Container";
                    btn.disabled = false;
                    return;
                }
            } else {
                payload = {
                    mode: 'basic',
                    image: document.getElementById('run-image').value.trim(),
                    name: document.getElementById('run-name').value.trim(),
                    ports: document.getElementById('run-ports').value.trim(),
                    volumes: document.getElementById('run-volumes').value.trim(),
                    env: document.getElementById('run-env').value.trim(),
                    restart: document.getElementById('run-restart').value
                };
            }

            try {
                const r = await fetch('./containers/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    credentials: 'include'
                });
                if (r.ok) {
                    showToast("Container ignition started");
                    switchTab('containers');
                } else {
                    const err = await r.json();
                    alert(err.detail || "Deployment failed");
                }
            } catch (e) {}
            btn.innerText = "Ignite Container";
            btn.disabled = false;
        }

        async function action(id, t) {
            await fetch(`./containers/${id}/${t}`, { method: 'POST', credentials: 'include' });
            showToast(`Signal: ${t}`);
            refresh();
        }

        async function deleteContainer(id, name) {
            if (confirm(`Irreversibly delete container ${name}?`)) {
                await fetch(`./containers/${id}/remove`, { method: 'POST', credentials: 'include' });
                showToast("Container removed");
                refresh();
            }
        }

        async function deleteImage(id) {
            if (confirm("Delete image?")) {
                await fetch(`./images/${id}`, { method: 'DELETE', credentials: 'include' });
                showToast("Image removed");
                refresh();
            }
        }

        async function deleteVolume(name) {
            if (confirm(`Erase volume ${name}? Data will be lost.`)) {
                await fetch(`./volumes/${name}`, { method: 'DELETE', credentials: 'include' });
                showToast("Volume erased");
                refresh();
            }
        }

        async function deleteNetwork(id) {
            if (confirm("Disconnect and delete network?")) {
                await fetch(`./networks/${id}`, { method: 'DELETE', credentials: 'include' });
                showToast("Network deleted");
                refresh();
            }
        }

        async function pullImg() {
            const img = document.getElementById('pull-input').value.trim();
            if (img) {
                await fetch('./images/pull', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: img }),
                    credentials: 'include'
                });
                document.getElementById('pull-input').value = "";
                showToast("Image pull queued");
                setTimeout(refresh, 1000);
            }
        }

        async function viewLogs(id, name) {
            document.getElementById('log-title').innerText = `Logs: ${name}`;
            document.getElementById('logText').innerText = "Streaming logs...";
            document.getElementById('log-view').style.display = 'flex';
            try {
                const r = await fetch(`./containers/${id}/logs`, { credentials: 'include' });
                const d = await r.json();
                document.getElementById('logText').innerText = d.logs || "No logs captured.";
            } catch (e) {
                document.getElementById('logText').innerText = "Failed to stream logs.";
            }
        }

        function closeLogs() {
            document.getElementById('log-view').style.display = 'none';
        }

        window.onload = () => {
            refresh();
            setInterval(refresh, 4000);
            lucide.createIcons();
        };
    </script>
</body>
</html>
