name: Package & Publish Extensions

on:
  push:
    branches: [ main ]
    paths:
      - 'extensions/**'
      - 'scripts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'extensions/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Lint Extension Manifests
        run: python scripts/lint_extensions.py

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build Packages
        run: |
          mkdir -p dist

          for dir in extensions/*/ ; do
            if [ -f "${dir}manifest.json" ]; then
              EXT_ID=$(python3 -c "import json; print(json.load(open('${dir}manifest.json'))['id'])")
              EXT_VERSION=$(python3 -c "import json; print(json.load(open('${dir}manifest.json'))['version'])")

              echo "Packaging ${EXT_ID} v${EXT_VERSION}..."
              (cd "$dir" && zip -r -q "../../dist/${EXT_ID}-${EXT_VERSION}.pclink" . -x "*.pyc" -x "__pycache__/*" -x ".git*" -x ".DS_Store")
            fi
          done

      - name: Generate Registry with Checksums
        run: python scripts/generate_registry.py

      - name: Commit Updated Registry
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add extensions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(registry): update extensions.json [skip ci]" && git push)

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extensions-latest
          files: dist/*.pclink
          name: Extension Marketplace Packages
          body: "Automated production release of PCLink Extension Marketplace packages."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}